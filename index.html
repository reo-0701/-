<script>


// =====================================================
// Supabase設定
// =====================================================

const SUPABASE_URL =
    "https://ohayijowyvphrgvwsywj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xrF9LWNH2UoNlB0WNUJcgA_lmLaMp0_";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// このブラウザを識別するID
// =====================================================

let visitorId =
    localStorage.getItem("diet_food_visitor_id");


if (!visitorId) {

    visitorId =
        crypto.randomUUID();

    localStorage.setItem(
        "diet_food_visitor_id",
        visitorId
    );

}


// =====================================================
// ローカルお気に入り
// =====================================================

let favoriteIds =
    JSON.parse(
        localStorage.getItem(
            "diet_food_favorites"
        ) || "[]"
    );


// =====================================================
// 削除トークン
// =====================================================

let deleteTokens =
    JSON.parse(
        localStorage.getItem(
            "diet_food_delete_tokens"
        ) || "{}"
    );


// =====================================================
// データ
// =====================================================

let foods = [];

let currentCategory = "all";

let currentView = "all";


// =====================================================
// HTML安全化
// =====================================================

function escapeHTML(text) {

    if (text === null || text === undefined) {

        return "";

    }

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


// =====================================================
// Supabaseから料理を取得
// =====================================================

async function loadFoods() {

    const list =
        document.getElementById(
            "food-list"
        );

    list.innerHTML = `
        <div class="empty-message">
            <div>🍳</div>
            <p>料理を読み込んでいます...</p>
        </div>
    `;


    try {

        const {
            data: foodData,
            error: foodError
        } = await supabaseClient

            .from("foods")

            .select("*")

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (foodError) {

            throw foodError;

        }


        const {
            data: likeData,
            error: likeError
        } = await supabaseClient

            .from("likes")

            .select(
                "food_id, visitor_id"
            );


        if (likeError) {

            throw likeError;

        }


        const {
            data: favoriteData,
            error: favoriteError
        } = await supabaseClient

            .from("favorites")

            .select(
                "food_id, visitor_id"
            );


        if (favoriteError) {

            throw favoriteError;

        }


        foods =
            (foodData || []).map(
                function(food) {

                    const likes =
                        (likeData || []).filter(
                            like =>
                                like.food_id
                                ===
                                food.id
                        );


                    const liked =
                        likes.some(
                            like =>
                                like.visitor_id
                                ===
                                visitorId
                        );


                    const favorite =
                        favoriteIds.includes(
                            food.id
                        );


                    return {

                        ...food,

                        likes:
                            likes.length,

                        liked:

                            liked,

                        favorite:

                            favorite

                    };

                }
            );


        displayFoods();


    }

    catch (error) {

        console.error(error);


        list.innerHTML = `
            <div class="empty-message">
                <div>⚠️</div>
                <p>
                    データの読み込みに失敗しました。
                </p>
                <small>
                    ${escapeHTML(
                        error.message ||
                        "Unknown error"
                    )}
                </small>
            </div>
        `;

    }

}


// =====================================================
// 投稿
// =====================================================

async function addFood() {

    const imageInput =
        document.getElementById(
            "food-image"
        );


    const author =
        document
            .getElementById("author")
            .value
            .trim();


    const name =
        document
            .getElementById("food-name")
            .value
            .trim();


    const category =
        document
            .getElementById("category")
            .value;


    const calories =
        document
            .getElementById("calories")
            .value;


    const protein =
        document
            .getElementById("protein")
            .value;


    const fat =
        document
            .getElementById("fat")
            .value;


    const carbs =
        document
            .getElementById("carbs")
            .value;


    const price =
        document
            .getElementById("price")
            .value;


    const ingredients =
        document
            .getElementById("ingredients")
            .value
            .trim();


    const description =
        document
            .getElementById("description")
            .value
            .trim();


    if (!name) {

        alert(
            "料理名を入力してください。"
        );

        return;

    }


    if (!calories) {

        alert(
            "カロリーを入力してください。"
        );

        return;

    }


    const button =
        document.querySelector(
            '.post-form button'
        );


    button.disabled = true;

    button.textContent =
        "投稿しています...";


    try {

        let imageUrl = "";


        // ==========================================
        // 画像アップロード
        // ==========================================

        if (
            imageInput.files &&
            imageInput.files.length > 0
        ) {

            const file =
                imageInput.files[0];


            if (!file.type.startsWith("image/")) {

                throw new Error(
                    "画像ファイルを選択してください。"
                );

            }


            if (
                file.size >
                5 * 1024 * 1024
            ) {

                throw new Error(
                    "画像は5MB以下にしてください。"
                );

            }


            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const fileName =
                `${crypto.randomUUID()}.${extension}`;


            const filePath =
                `${fileName}`;


            const {
                error: uploadError
            } = await supabaseClient

                .storage

                .from("food-images")

                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );


            if (uploadError) {

                throw uploadError;

            }


            const {
                data: publicData
            } =
                supabaseClient

                    .storage

                    .from("food-images")

                    .getPublicUrl(
                        filePath
                    );


            imageUrl =
                publicData.publicUrl;

        }


        // ==========================================
        // 削除用トークン
        // ==========================================

        const deleteToken =
            crypto.randomUUID();


        // ==========================================
        // DBへ投稿
        // ==========================================

        const {
            data,
            error
        } = await supabaseClient

            .from("foods")

            .insert({

                name:
                    name,

                author:
                    author || "名無し",

                category:
                    category,

                image_url:
                    imageUrl,

                calories:
                    Number(calories),

                protein:
                    Number(protein) || 0,

                fat:
                    Number(fat) || 0,

                carbs:
                    Number(carbs) || 0,

                price:
                    Number(price) || 0,

                ingredients:
                    ingredients,

                description:
                    description,

                delete_token:
                    deleteToken

            })

            .select()

            .single();


        if (error) {

            throw error;

        }


        // ==========================================
        // 削除トークンをこのブラウザに保存
        // ==========================================

        deleteTokens[data.id] =
            deleteToken;


        localStorage.setItem(
            "diet_food_delete_tokens",
            JSON.stringify(
                deleteTokens
            )
        );


        alert(
            "投稿しました！"
        );


        resetForm();


        await loadFoods();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }

    catch (error) {

        console.error(error);


        alert(
            "投稿に失敗しました。\n\n" +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

    finally {

        button.disabled = false;

        button.textContent =
            "＋ この料理を投稿する";

    }

}


// =====================================================
// フォームリセット
// =====================================================

function resetForm() {

    document
        .getElementById("food-image")
        .value = "";


    document
        .getElementById("author")
        .value = "";


    document
        .getElementById("food-name")
        .value = "";


    document
        .getElementById("calories")
        .value = "";


    document
        .getElementById("protein")
        .value = "";


    document
        .getElementById("fat")
        .value = "";


    document
        .getElementById("carbs")
        .value = "";


    document
        .getElementById("price")
        .value = "";


    document
        .getElementById("ingredients")
        .value = "";


    document
        .getElementById("description")
        .value = "";

}


// =====================================================
// 食事表示
// =====================================================

function displayFoods(
    foodArray = foods
) {

    const list =
        document.getElementById(
            "food-list"
        );


    list.innerHTML = "";


    if (foodArray.length === 0) {

        list.innerHTML = `

            <div class="empty-message">

                <div>
                    🍽️
                </div>

                <p>
                    条件に合うダイエット飯がありません。
                </p>

            </div>

        `;

        return;

    }


    foodArray.forEach(
        function(food) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "food-card";


            card.onclick =
                function() {

                    showFoodDetail(
                        food
                    );

                };


            let imageHTML = "";


            if (food.image_url) {

                imageHTML = `

                    <img
                        src="${escapeHTML(food.image_url)}"
                        class="food-image"
                        alt="${escapeHTML(food.name)}">

                `;

            }

            else {

                imageHTML = `

                    <div class="no-image">

                        🍽️

                    </div>

                `;

            }


            const safeAuthor =
                escapeHTML(
                    food.author ||
                    "名無し"
                );


            const safeName =
                escapeHTML(
                    food.name
                );


            card.innerHTML = `

                ${imageHTML}


                <div class="card-category">

                    ${escapeHTML(
                        food.category ||
                        "その他"
                    )}

                </div>


                <h3>

                    ${safeName}

                </h3>


                <button
                    class="author-link"
                    data-author="${safeAuthor}">

                    👤 ${safeAuthor}

                </button>


                <div class="info">

                    <span>
                        🔥 ${food.calories} kcal
                    </span>

                    <span>
                        💪 P ${food.protein}g
                    </span>

                    <span>
                        🥑 F ${food.fat}g
                    </span>

                    <span>
                        🍚 C ${food.carbs}g
                    </span>

                    <span>
                        💰 ${food.price}円
                    </span>

                </div>


                <div class="card-bottom">

                    <button
                        class="like-button ${
                            food.liked
                            ? "liked"
                            : ""
                        }">

                        ${
                            food.liked
                            ? "❤️"
                            : "♡"
                        }

                        ${food.likes || 0}

                    </button>


                    <button
                        class="favorite-button">

                        ${
                            food.favorite
                            ? "⭐"
                            : "☆"
                        }

                    </button>


                    <button
                        class="delete-button">

                        🗑️

                    </button>

                </div>

            `;


            // ======================================
            // 投稿者
            // ======================================

            const authorButton =
                card.querySelector(
                    ".author-link"
                );


            authorButton.onclick =
                function(event) {

                    event.stopPropagation();

                    showAuthorPage(
                        food.author ||
                        "名無し"
                    );

                };


            // ======================================
            // いいね
            // ======================================

            const likeButton =
                card.querySelector(
                    ".like-button"
                );


            likeButton.onclick =
                function(event) {

                    event.stopPropagation();

                    toggleLike(
                        food.id
                    );

                };


            // ======================================
            // お気に入り
            // ======================================

            const favoriteButton =
                card.querySelector(
                    ".favorite-button"
                );


            favoriteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    toggleFavorite(
                        food.id
                    );

                };


            // ======================================
            // 削除
            // ======================================

            const deleteButton =
                card.querySelector(
                    ".delete-button"
                );


            deleteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    deleteFood(
                        food.id
                    );

                };


            list.appendChild(
                card
            );

        }
    );

}


// =====================================================
// いいね
// =====================================================

async function toggleLike(id) {

    const food =
        foods.find(
            item =>
                item.id === id
        );


    if (!food) {

        return;

    }


    try {

        if (food.liked) {

            const {
                error
            } = await supabaseClient

                .from("likes")

                .delete()

                .eq(
                    "food_id",
                    id
                )

                .eq(
                    "visitor_id",
                    visitorId
                );


            if (error) {

                throw error;

            }

        }

        else {

            const {
                error
            } = await supabaseClient

                .from("likes")

                .insert({

                    food_id:
                        id,

                    visitor_id:
                        visitorId

                });


            if (error) {

                throw error;

            }

        }


        await loadFoods();

    }

    catch (error) {

        console.error(error);

        alert(
            "いいねの更新に失敗しました。"
        );

    }

}


// =====================================================
// お気に入り
// =====================================================

async function toggleFavorite(id) {

    const food =
        foods.find(
            item =>
                item.id === id
        );


    if (!food) {

        return;

    }


    try {

        if (favoriteIds.includes(id)) {

            const {
                error
            } = await supabaseClient

                .from("favorites")

                .delete()

                .eq(
                    "food_id",
                    id
                )

                .eq(
                    "visitor_id",
                    visitorId
                );


            if (error) {

                throw error;

            }


            favoriteIds =
                favoriteIds.filter(
                    favoriteId =>
                        favoriteId !== id
                );

        }

        else {

            const {
                error
            } = await supabaseClient

                .from("favorites")

                .insert({

                    food_id:
                        id,

                    visitor_id:
                        visitorId

                });


            if (error) {

                throw error;

            }


            favoriteIds.push(id);

        }


        localStorage.setItem(
            "diet_food_favorites",
            JSON.stringify(
                favoriteIds
            )
        );


        await loadFoods();

    }

    catch (error) {

        console.error(error);

        alert(
            "お気に入りの更新に失敗しました。"
        );

    }

}


// =====================================================
// 削除
// =====================================================

async function deleteFood(id) {

    const food =
        foods.find(
            item =>
                item.id === id
        );


    if (!food) {

        return;

    }


    const token =
        deleteTokens[id];


    if (!token) {

        alert(
            "この投稿を削除できる情報がこのブラウザにありません。"
        );

        return;

    }


    const result =
        confirm(
            `「${food.name}」を削除しますか？`
        );


    if (!result) {

        return;

    }


    try {

        const {
            data,
            error
        } = await supabaseClient

            .rpc(
                "delete_food",
                {
                    target_id:
                        id,

                    target_token:
                        token
                }
            );


        if (error) {

            throw error;

        }


        if (!data) {

            alert(
                "削除できませんでした。"
            );

            return;

        }


        delete deleteTokens[id];


        localStorage.setItem(
            "diet_food_delete_tokens",
            JSON.stringify(
                deleteTokens
            )
        );


        alert(
            "投稿を削除しました。"
        );


        await loadFoods();

    }

    catch (error) {

        console.error(error);

        alert(
            "削除に失敗しました。\n\n" +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}

// =====================================================
// カテゴリー
// =====================================================

function filterCategory(
    category
) {

    currentCategory =
        category;

    currentView =
        "all";

    applyFilters();

}


// =====================================================
// 絞り込み
// =====================================================

function applyFilters() {

    currentView =
        "all";


    const calorie =
        document
            .getElementById(
                "calorieFilter"
            )
            .value;


    const protein =
        document
            .getElementById(
                "proteinFilter"
            )
            .value;


    const fat =
        document
            .getElementById(
                "fatFilter"
            )
            .value;


    const price =
        document
            .getElementById(
                "priceFilter"
            )
            .value;


    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    let results =
        [...foods];


    // カテゴリー

    if (
        currentCategory !==
        "all"
    ) {

        results =
            results.filter(
                food =>
                    food.category
                    ===
                    currentCategory
            );

    }


    // カロリー

    if (
        calorie !==
        "all"
    ) {

        results =
            results.filter(
                food =>
                    Number(
                        food.calories
                    )
                    <=
                    Number(calorie)
            );

    }


    // タンパク質

    if (
        protein !==
        "all"
    ) {

        results =
            results.filter(
                food =>
                    Number(
                        food.protein
                    )
                    >=
                    Number(protein)
            );

    }


    // 脂質

    if (
        fat !==
        "all"
    ) {

        results =
            results.filter(
                food =>
                    Number(
                        food.fat
                    )
                    <=
                    Number(fat)
            );

    }


    // 価格

    if (
        price !==
        "all"
    ) {

        results =
            results.filter(
                food =>
                    Number(
                        food.price
                    )
                    <=
                    Number(price)
            );

    }


    // 検索

    if (keyword) {

        results =
            results.filter(
                function(food) {

                    const text = `

                        ${food.name || ""}

                        ${food.author || ""}

                        ${food.ingredients || ""}

                        ${food.description || ""}

                        ${food.category || ""}

                    `.toLowerCase();


                    return text.includes(
                        keyword
                    );

                }
            );

    }


    displayFoods(
        results
    );

}


// =====================================================
// 検索
// =====================================================

function searchFoods() {

    applyFilters();

}


// =====================================================
// フィルターリセット
// =====================================================

function clearFilters() {

    document
        .getElementById(
            "calorieFilter"
        )
        .value = "all";


    document
        .getElementById(
            "proteinFilter"
        )
        .value = "all";


    document
        .getElementById(
            "fatFilter"
        )
        .value = "all";


    document
        .getElementById(
            "priceFilter"
        )
        .value = "all";


    document
        .getElementById(
            "searchInput"
        )
        .value = "";


    currentCategory =
        "all";


    currentView =
        "all";


    displayFoods();

}


// =====================================================
// 並び替え
// =====================================================

function sortFoods() {

    const sortType =
        document
            .getElementById(
                "sortSelect"
            )
            .value;


    let sortedFoods =
        [...foods];


    if (
        sortType ===
        "new"
    ) {

        sortedFoods.sort(
            (a, b) =>
                new Date(
                    b.created_at
                )
                -
                new Date(
                    a.created_at
                )
        );

    }


    else if (
        sortType ===
        "calories-low"
    ) {

        sortedFoods.sort(
            (a, b) =>
                Number(a.calories)
                -
                Number(b.calories)
        );

    }


    else if (
        sortType ===
        "calories-high"
    ) {

        sortedFoods.sort(
            (a, b) =>
                Number(b.calories)
                -
                Number(a.calories)
        );

    }


    else if (
        sortType ===
        "price-low"
    ) {

        sortedFoods.sort(
            (a, b) =>
                Number(a.price)
                -
                Number(b.price)
        );

    }


    else if (
        sortType ===
        "price-high"
    ) {

        sortedFoods.sort(
            (a, b) =>
                Number(b.price)
                -
                Number(a.price)
        );

    }


    else if (
        sortType ===
        "protein-high"
    ) {

        sortedFoods.sort(
            (a, b) =>
                Number(b.protein)
                -
                Number(a.protein)
        );

    }


    else if (
        sortType ===
        "likes-high"
    ) {

        sortedFoods.sort(
            (a, b) =>
                (b.likes || 0)
                -
                (a.likes || 0)
        );

    }


    displayFoods(
        sortedFoods
    );

}


// =====================================================
// 詳細表示
// =====================================================

function showFoodDetail(food) {

    if (!food) {

        return;

    }


    const detail =
        document.getElementById(
            "food-detail"
        );


    const overlay =
        document.getElementById(
            "detail-overlay"
        );


    const content =
        document.getElementById(
            "detail-content"
        );


    let imageHTML = "";


    if (food.image_url) {

        imageHTML = `

            <img
                src="${escapeHTML(food.image_url)}"
                class="detail-image"
                alt="${escapeHTML(food.name)}">

        `;

    }

    else {

        imageHTML = `

            <div class="detail-no-image">

                🍽️

            </div>

        `;

    }


    content.innerHTML = `

        ${imageHTML}


        <div class="detail-category">

            ${escapeHTML(
                food.category ||
                "その他"
            )}

        </div>


        <h2>
            ${escapeHTML(
                food.name
            )}
        </h2>


        <button
            class="detail-author"
            id="detail-author-button">

            👤 投稿者：
            ${escapeHTML(
                food.author ||
                "名無し"
            )}

        </button>


        <div class="detail-info">

            <div>
                🔥
                <strong>
                    ${food.calories}
                </strong>
                kcal
            </div>


            <div>
                💪 P
                <strong>
                    ${food.protein}
                </strong>
                g
            </div>


            <div>
                🥑 F
                <strong>
                    ${food.fat}
                </strong>
                g
            </div>


            <div>
                🍚 C
                <strong>
                    ${food.carbs}
                </strong>
                g
            </div>


            <div>
                💰
                <strong>
                    ${food.price}
                </strong>
                円
            </div>


            <div>
                ❤️
                <strong>
                    ${food.likes || 0}
                </strong>
                いいね
            </div>

        </div>



        <h3>
            🥕 材料
        </h3>


        <div class="detail-text">

            ${
                escapeHTML(
                    food.ingredients ||
                    "材料の情報はありません。"
                )
                .replace(
                    /\n/g,
                    "<br>"
                )
            }

        </div>



        <h3>
            🍳 作り方・説明
        </h3>


        <div class="detail-text">

            ${
                escapeHTML(
                    food.description ||
                    "説明はありません。"
                )
                .replace(
                    /\n/g,
                    "<br>"
                )
            }

        </div>

    `;


    document
        .getElementById(
            "detail-author-button"
        )
        .onclick =
        function() {

            showAuthorPage(
                food.author ||
                "名無し"
            );

        };


    overlay.style.display =
        "block";


    detail.style.display =
        "block";

}


// =====================================================
// 詳細を閉じる
// =====================================================

function closeFoodDetail() {

    document
        .getElementById(
            "detail-overlay"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "food-detail"
        )
        .style.display =
        "none";

}


// =====================================================
// 投稿者ページ
// =====================================================

function showAuthorPage(
    author
) {

    closeFoodDetail();


    const authorFoods =
        foods.filter(
            food =>
                (
                    food.author ||
                    "名無し"
                )
                ===
                author
        );


    const page =
        document.getElementById(
            "author-page"
        );


    const overlay =
        document.getElementById(
            "author-overlay"
        );


    const content =
        document.getElementById(
            "author-content"
        );


    const totalLikes =
        authorFoods.reduce(
            (
                sum,
                food
            ) =>
                sum +
                (
                    food.likes ||
                    0
                ),
            0
        );


    content.innerHTML = `

        <div class="author-header">

            <div class="author-icon">
                👤
            </div>


            <h2>
                ${escapeHTML(author)}
            </h2>


            <p>
                ${authorFoods.length}
                件の投稿
                ・
                ${totalLikes}
                いいね
            </p>

        </div>


        <h3>
            ${escapeHTML(author)}さんの投稿
        </h3>


        <div
            class="author-food-list">

            ${
                authorFoods.length === 0

                ?

                "<p>投稿がありません。</p>"

                :

                authorFoods
                    .map(
                        food => `

                            <button
                                class="author-food-item"
                                data-food-id="${food.id}">

                                ${
                                    food.image_url

                                    ?

                                    `<img
                                        src="${escapeHTML(food.image_url)}"
                                        alt="">`

                                    :

                                    `<div class="mini-no-image">
                                        🍽️
                                    </div>`
                                }


                                <div>

                                    <strong>
                                        ${escapeHTML(
                                            food.name
                                        )}
                                    </strong>


                                    <span>
                                        🔥
                                        ${food.calories}
                                        kcal
                                    </span>


                                    <span>
                                        ❤️
                                        ${food.likes || 0}
                                    </span>

                                </div>

                            </button>

                        `
                    )
                    .join("")

            }

        </div>

    `;


    content
        .querySelectorAll(
            ".author-food-item"
        )
        .forEach(
            function(button) {

                button.onclick =
                    function() {

                        const id =
                            Number(
                                button.dataset
                                    .foodId
                            );


                        const selectedFood =
                            foods.find(
                                food =>
                                    food.id === id
                            );


                        closeAuthorPage();


                        showFoodDetail(
                            selectedFood
                        );

                    };

            }
        );


    overlay.style.display =
        "block";


    page.style.display =
        "block";

}


// =====================================================
// 投稿者ページを閉じる
// =====================================================

function closeAuthorPage() {

    document
        .getElementById(
            "author-overlay"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "author-page"
        )
        .style.display =
        "none";

}


// =====================================================
// 初期表示
// =====================================================

loadFoods();


</script>
